<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Learning Terminal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #030712;
            --text-color: #00ff66;
            --border-color: #1f2937;
            --prompt-color: #f43f5e;
            --info-color: #facc15;
            --table-header: #1e293b;
            --table-row-alt: #0f172a;
            --input-bg: #030712;
            --text-main: #00ff66;
        }

        .light-mode {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --text-color: #0f766e;
            --border-color: #cbd5e1;
            --prompt-color: #e11d48;
            --info-color: #b45309;
            --table-header: #e2e8f0;
            --table-row-alt: #f8fafc;
            --input-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button.toggle-btn {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        /* Top Command Line Section */
        .input-section {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .input-line {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .prompt {
            color: var(--prompt-color);
            margin-right: 10px;
            font-weight: bold;
        }

        input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        /* Bottom Section: Side-by-Side Output & Table */
        .bottom-sections {
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-height: 450px;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--text-main);
        }

        #output {
            white-space: pre-wrap;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 14px;
            color: var(--text-color);
        }

        .table-container {
            overflow-y: auto;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
            color: var(--text-main);
        }

        th {
            background-color: var(--table-header);
        }

        tr:nth-child(even) {
            background-color: var(--table-row-alt);
        }

        .info { color: var(--info-color); font-weight: bold; }
        .graph { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header Bar -->
    <div class="header-bar">
        <div>
            <span style="font-weight: bold; font-size: 18px;">Cypher Learning Terminal</span>
            <div style="font-size: 12px; opacity: 0.7;">Real Project Mock Sandbox</div>
        </div>
        <button class="toggle-btn" onclick="toggleTheme()">🌓 Light/Dark Mode</button>
    </div>

    <!-- Top Command Line Input -->
    <div class="input-section">
        <div style="font-size: 13px; margin-bottom: 8px; opacity: 0.8;">Type command (e.g., MERGE (p:Person {name:'Nahid'}) RETURN p)</div>
        <div class="input-line">
            <span class="prompt">cypher></span>
            <input type="text" id="commandInput" autofocus autocomplete="off" placeholder="Type query here and hit Enter...">
        </div>
    </div>

    <!-- Bottom Sections: Output Left, Table Right -->
    <div class="bottom-sections">
        <!-- Terminal Output View -->
        <div class="panel">
            <h3>Terminal Output</h3>
            <div id="output"></div>
        </div>

        <!-- Database Table View -->
        <div class="panel">
            <h3>Database Table View</h3>
            <div class="table-container">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Label</th>
                            <th>Properties</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3" style="text-align: center; opacity: 0.6;">No data in database yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const graphDB = {
        nodes: [],
        relationships: []
    };

    const output = document.getElementById('output');
    const input = document.getElementById('commandInput');
    const tableBody = document.querySelector('#resultTable tbody');

    function log(text, className = '') {
        output.innerHTML += `<span class="${className}">${text}</span>\n`;
        output.scrollTop = output.scrollHeight;
    }

    function updateTable() {
        if (graphDB.nodes.length === 0 && graphDB.relationships.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; opacity: 0.6;">No data in database yet.</td></tr>`;
            return;
        }

        let html = '';
        graphDB.nodes.forEach(n => {
            html += `<tr>
                <td><b>Node</b></td>
                <td>:${n.label}</td>
                <td>{name: "${n.name}"}</td>
            </tr>`;
        });
        graphDB.relationships.forEach(r => {
            html += `<tr>
                <td><b>Rel</b></td>
                <td>-[:${r.type}]-></td>
                <td>${r.from} ➔ ${r.to}</td>
            </tr>`;
        });
        tableBody.innerHTML = html;
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const cmd = input.value.trim();
            if (!cmd) return;

            log(`\ncypher> ${cmd}`, 'info');
            const upperCmd = cmd.toUpperCase();

            if (upperCmd.startsWith('MERGE') && !upperCmd.includes('-')) {
                const match = cmd.match(/MERGE\s+\(\s*([a-zA-Z0-9_]+)\s*:\s*([a-zA-Z0-9_]+)\s*\{\s*name\s*:\s*["']([^"']+)["']\s*\}\s*\)/i);
                if (match) {
                    const [_, alias, label, name] = match;
                    let existing = graphDB.nodes.find(n => n.label.toLowerCase() === label.toLowerCase() && n.name.toLowerCase() === name.toLowerCase());
                    if (!existing) {
                        graphDB.nodes.push({ label, name });
                        log(`[OK] Node created: (${alias}:${label} {name: "${name}"})`, 'graph');
                    } else {
                        log(`[OK] Node already exists (MERGE matched): (${alias}:${label} {name: "${name}"})`, 'graph');
                    }
                    updateTable();
                } else {
                    log(`[OK] Merge executed successfully.`);
                }
            } 
            else if (upperCmd.includes('-[:') && upperCmd.includes('->')) {
                graphDB.relationships.push({ type: "REL", from: "Node", to: "Node" });
                log(`[OK] Relationship created successfully!`, 'graph');
                updateTable();
            }
            else if (upperCmd.startsWith('MATCH') && upperCmd.includes('RETURN')) {
                log(`--- Result Rows ---`, 'info');
                if (graphDB.nodes.length === 0) {
                    log(`No records found.`);
                } else {
                    graphDB.nodes.forEach((n, i) => {
                        log(`[Row ${i + 1}] (: ${n.label} {name: "${n.name}"})`);
                    });
                }
            }
            else if (upperCmd.includes('COUNT')) {
                log(`--- Result ---`, 'info');
                log(`count = ${graphDB.nodes.length}`);
            }
            else if (upperCmd === 'CLEAR') {
                output.innerHTML = '';
            } 
            else {
                log(`Command processed in mock environment.`);
            }

            input.value = '';
        }
    });
</script>

</body>
</html>
